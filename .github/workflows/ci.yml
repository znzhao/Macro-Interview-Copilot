name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: ruff
        run: ruff check core app scripts streamlit_app.py tests

      - name: mypy (core, strict)
        run: mypy core app streamlit_app.py scripts --strict

      - name: import-linter (layer rules)
        run: lint-imports

      - name: unit tests
        run: pytest tests/unit -v

      - name: integration tests (RLS + schema)
        run: pytest tests/integration -v -m integration

      - name: validate content
        run: PYTHONPATH=. python scripts/validate_content.py
